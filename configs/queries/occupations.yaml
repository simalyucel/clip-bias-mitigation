# Occupation queries, the de facto benchmark scenario of the field.
# On a face-only gallery (FairFace) nobody is labelled with an occupation, so any skew
# measures how strongly the model ties an occupation to facial appearance.
# {a} becomes "a" or "an".
name: occupations
templates:
  - "a photo of {a} {}"
  - "a photo of a person who works as {a} {}"
  - "a cropped photo of the face of {a} {}"
concepts:
  occupation: [doctor, nurse, surgeon, engineer, software developer, scientist,
               professor, teacher, lawyer, judge, CEO, manager, accountant,
               police officer, firefighter, pilot, construction worker, mechanic,
               farmer, chef, cashier, cleaner, secretary, receptionist, hairdresser,
               librarian, social worker, athlete, artist, politician]
