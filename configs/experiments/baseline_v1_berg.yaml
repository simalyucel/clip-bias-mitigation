# Baseline v1, setup B: Berg et al. (2022) protocol, wide crop (1.25), gender-balanced gallery.
# Pretrained CLIP, no mitigation. Fairness on FairFace + retrieval utility on Flickr30K.
seed: 0
model: configs/models/clip_vitb32.yaml
query_sets:
  - configs/queries/chuang2023.yaml
  - configs/queries/berg2022_test.yaml
  - configs/queries/occupations.yaml
dataset:
  name: fairface
  split: validation
  padding: "1.25"
  balance_gender: true
  balance_seed: 1
  max_images: null
# age_adult: adults only, 5 bands (20-29 ... 60+); age_coarse: 0-19 / 20-39 / 40-59 / 60+;
# plain "age" keeps the 9 FairFace bins.
attributes: [gender, race, age_adult]
metrics:
  k: [100, 1000]
  references: [uniform, gallery]
  zero_floor: 0.5
significance:
  n_null: 1000          # random rankings per attribute (chance level)
  seed: 0
  alpha: 0.05           # after Benjamini-Hochberg correction
utility:
  dataset: flickr30k    # 1k test split, 5 captions per image
  ks: [1, 5, 10]
batch_size: 256
cache_dir: data/embeddings
output_dir: results/baseline_v1_berg
