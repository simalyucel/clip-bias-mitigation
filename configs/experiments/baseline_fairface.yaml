# Baseline v1: pretrained CLIP, no mitigation, FairFace validation split.
seed: 0
model: configs/models/clip_vitb32.yaml
query_sets:
  - configs/queries/chuang2023.yaml       # replication / sanity check
  - configs/queries/berg2022_test.yaml    # IAT adjectives, many templates
  - configs/queries/occupations.yaml      # occupations
dataset:
  name: fairface
  split: validation
  padding: "0.25"
  max_images: null          # e.g. 2000 for a quick test run
attributes: [gender, race, age]
metrics:
  k: [100, 1000]
  references: [uniform, gallery]   # add "custom" + a "custom:" block for real-world stats
  zero_floor: 0.5                  # a group absent from the top-k counts as half an image
batch_size: 256
cache_dir: data/embeddings
output_dir: results/baseline_fairface
